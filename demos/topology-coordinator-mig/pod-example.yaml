apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: demo-nvidia-mig-numa
  namespace: default
spec:
  devices:
    requests:
    - name: mig
      exactly:
        deviceClassName: nvidia-mig-numa-demo-numa0
        count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-nvidia-mig-numa-pod
  namespace: default
spec:
  containers:
  - name: workload
    image: registry.k8s.io/pause:3.9
    resources:
      claims:
      - name: mig
  resourceClaims:
  - name: mig
    resourceClaimName: demo-nvidia-mig-numa
