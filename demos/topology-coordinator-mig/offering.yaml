apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-mig-numa-demo
  namespace: nodepartition
  labels:
    nodepartition.dra.k8s.io/device-grouping: "true"
data:
  name: nvidia-mig-numa-demo
  displayName: NVIDIA MIG 1g.10gb NUMA placement
  description: One dynamic 1g.10gb MIG slice with NUMA-specific request variants.
  intentLevel: hardware-specific
  categories: gpu,mig,topology
  workloadTypes: inference
  visibility: public
  offering: "true"
  alignment: numaNode
  devices: |
    - class: mig.nvidia.com
      profile: 1g.10gb
      count: 1
