apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: demo-mi300x-inference
spec:
  devices:
    requests:
    - name: partition
      exactly:
        deviceClassName: mi300x-inference-numa
        count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-mi300x-inference-pod
spec:
  containers:
  - name: workload
    image: registry.k8s.io/pause:3.9
    resources:
      claims:
      - name: partition
  resourceClaims:
  - name: partition
    resourceClaimName: demo-mi300x-inference
