apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-mig-slice-class
  namespace: nodepartition
  labels:
    nodepartition.dra.k8s.io/topology-rule: "true"
data:
  attribute: gpu.nvidia.com/type
  type: string
  driver: gpu.nvidia.com
  deviceClass: mig.nvidia.com
  whenValue: mig
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-mig-profile
  namespace: nodepartition
  labels:
    nodepartition.dra.k8s.io/topology-rule: "true"
data:
  attribute: gpu.nvidia.com/profile
  type: string
  driver: gpu.nvidia.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-mig-1g-10gb
  namespace: nodepartition
  labels:
    nodepartition.dra.k8s.io/device-grouping: "true"
data:
  name: nvidia-mig-1g-10gb
  displayName: NVIDIA MIG 1g.10gb
  description: One dynamic 1g.10gb MIG slice.
  intentLevel: hardware-specific
  categories: gpu,mig
  workloadTypes: inference
  visibility: public
  offering: "true"
  alignment: pcieRoot
  devices: |
    - class: mig.nvidia.com
      profile: 1g.10gb
      count: 1
---
