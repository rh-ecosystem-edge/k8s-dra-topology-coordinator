nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

driverName: "nodepartition.dra.k8s.io"

# auto publishes fixed partitions and groupings; partitions or groupings
# restrict the controller to one output family.
partitionMode: "auto"

controller:
  replicaCount: 1
  image:
    repository: ghcr.io/rh-ecosystem-edge/nodepartition-controller
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  shutdownTimeout: "30s"
  healthPort: 8081
  # Namespace whose topology-rule and device-grouping ConfigMaps the controller
  # trusts. Defaults to the release namespace.
  configNamespace: ""
  # Watch ConfigMaps in every namespace instead. This lets teams create their
  # own offerings, but anyone who can create a labeled ConfigMap can then
  # publish DeviceClasses, including driver opaque config.
  watchAllNamespaces: false
  leaderElection:
    namespace: "kube-system"
    id: "nodepartition-controller"
  webhook:
    port: 9443
    tls:
      # mode: openshift | cert-manager | manual
      # cert-manager mode expects the issuer below to already exist.
      mode: "cert-manager"
      certManager:
        issuerName: "selfsigned-issuer"
        issuerKind: "ClusterIssuer"
      # For manual mode only:
      caBundle: ""
  networkPolicy:
    enabled: false
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
