apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nodepartition.fullname" . }}-controller-leader
  namespace: {{ .Values.controller.leaderElection.namespace }}
  labels:
    {{- include "nodepartition.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nodepartition.fullname" . }}-controller-leader
  namespace: {{ .Values.controller.leaderElection.namespace }}
  labels:
    {{- include "nodepartition.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nodepartition.fullname" . }}-controller-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "nodepartition.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
