name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rh-ecosystem-edge/nodepartition-controller
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Set chart version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${VERSION}/" deploy/helm/nodepartition/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deploy/helm/nodepartition/Chart.yaml

      - name: Package and push chart
        run: |
          helm package deploy/helm/nodepartition
          helm push nodepartition-*.tgz oci://ghcr.io/rh-ecosystem-edge/charts

  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build nodepartitionctl release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            ASSET="nodepartitionctl-${VERSION}-linux-${ARCH}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build \
              -ldflags="-s -w -extldflags=-static" \
              -trimpath \
              -o dist/nodepartitionctl \
              ./cmd/nodepartitionctl
            tar -C dist -czf "dist/${ASSET}.tar.gz" nodepartitionctl
            rm dist/nodepartitionctl
          done
          (cd dist && sha256sum nodepartitionctl-*.tar.gz > checksums.txt)

      - name: Publish nodepartitionctl release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nodepartitionctl-*.tar.gz
            dist/checksums.txt
